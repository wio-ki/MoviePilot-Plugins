 // seg：{t 这一口说的话, face 表情, g 手势, by 署名, fx 这一口之后的特效, ms 覆盖停留时间}
 // tok 由 recite 统一发号：几口台词共用一个号，中途被打断时整段一起作废
 function stage(seg,tok){
  const chars=Array.from(seg.t||'');
  if(k.perfTok!==tok)return;
  if(seg.face)face(seg.face,1800);k.gesture={name:seg.g||'',until:now()+2200};
  if(!seg.keep)k.target=null;

  say(seg.t,seg.ms??clamp(1100+chars.length*150,1900,6000),3,{perf:1,by:seg.by});
  if(seg.fx)later(()=>{if(k.perfTok===tok)seg.fx();},260);

 let bag=[];
 function nextQuote(){if(!bag.length){bag=QUOTES.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}}return bag.pop();}
 function recite(key){
  if(k.away||k.mode==='leave'||k.mode==='drag'||k.mode==='air')return false;
  // 已经在念：最多排一句，念完接上，不把嘴里的掐掉
  if(k.perf){if(k.quoteQueue.length<2)k.quoteQueue.push(key||'');return false;}
  if(k.mode==='sleep')wake();
  const name=key&&LINES[key]?key:nextQuote(),line=LINES[name];
  if(name==='fly'&&k.perched)later(()=>{if(k.perched&&k.alive){hopDown();later(()=>leapUp(),1500);}},1500);
  const segs=line.segs.map(([t,face,g,o])=>({t,face,g,by:line.by,...(o||{})})),tok=++k.perfTok;
  // 分句由每帧接着开口（stepPerf）：上一口说到八成时下一口就上，气泡不关也不空
  k.perf={key:name,by:line.by,at:now(),tok,pending:segs,due:now(),endAt:0};
  k.lastQuote=now();foundPerf(name);

 // 每帧：上一口说到八成，下一口接着开口。最后一口说完再留两秒收尾
 function stepPerf(t){
  const p=k.perf;if(!p||k.perfTok!==p.tok)return;
  if(t<p.due)return;
  const seg=p.pending.shift();
  if(seg){stage(seg,p.tok);
   // 这一口要念满：打完之后至少再看 520ms 加上每个字 70ms，且不短于 say 给的停留。
   // 余量只留一口气，下一口赶得上，读者也不会把上一句读完了还在等
   const chars=Array.from(seg.t||'').length,read=t+Math.max(0,k.typeEnd-t)+520+chars*70;
   p.due=Math.max(k.talkUntil,read)+120;return;}
  // 最后一口说完，气泡多留一会儿
  // 最后一句的字还显示着就再多留一会儿：收尾时间跟着 talkUntil 走
  p.endAt||=t;
  if(t>Math.max(p.endAt,k.talkUntil)+1100)endPerf(p.tok);
 }

  if(k.perfTok!==tok||!k.perf)return;
  k.perf=null;flag('qt',false);bubbleQ.textContent='';

  if(queued!==undefined){later(()=>{if(k.alive)recite(queued||undefined);},420);return;}
  const d=k.deferSay;k.deferSay=null;
  // 台词收尾和状态播报之间留一口气，进度、NG 之类不要贴着台词后面马上冒出来
  if(d)later(()=>{if(k.alive&&!k.perf)say(d.text,d.ms,d.prio,d.opt);},1500);
