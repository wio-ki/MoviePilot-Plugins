 // ---- 插件状态
 function findFrame(){if(k.frame?.isConnected)return k.frame;const f=doc.querySelector('iframe.mcg-pet-frame');if(f)k.frame=f;return f;}
 function read(f){try{return JSON.parse(f?.getAttribute('data-state')||'{}')||{};}catch{return {};}}
 let prior='',lastTs=0,pollUrl='',pollDead=false,pollFail=0,pollTimer=0,ticks=0;
 function apply(s,fromFrame){
  if(!s||typeof s!=='object')return;
  if(fromFrame&&typeof s.poll==='string'&&!pollDead)pollUrl=s.poll;
  // iframe 上的状态是页面渲染那一刻的，轮询到更新的以后就不再回头用它
  const ts=+s.ts||0;if(fromFrame&&ts&&ts<lastTs)return;if(ts>lastTs)lastTs=ts;
  const c={enabled:s.enabled!==false,noServer:!!s.noServer,running:!!s.running,done:+s.done||0,total:+s.total||0,failed:+s.failed||0,style:String(s.style||''),library:String(s.library||''),auto:!!s.auto};
  const key=JSON.stringify(c);if(key===prior)return;
  const first=prior==='',t=now(),lib=c.library?`《${c.library.slice(0,14)}》`:'';prior=key;k.state=c;
  if(c.running&&!k.wasRunning){
   k.runTotal=0;k.lastDone=c.done;k.lastProgress=t;if(k.mode==='sleep')wake();clap();face('wow',600);
   say(c.auto?`有新片入库，我去补拍${lib||'封面'}。`:lib?`Action！先拍${lib}。`:'Action！开拍啦。',null,3,{st:1,prog:1});
  }else if(c.running&&c.total&&c.done!==k.lastDone&&t-(k.lastProgress||0)>2000){
   k.lastProgress=t;k.lastDone=c.done;say(`第 ${c.done} / ${c.total} 条`+(lib?`，在拍${lib}`:''),2200,3,{st:1,prog:1});if(Math.random()<.5)clap();
  }
  if(c.running)k.runTotal=Math.max(k.runTotal,c.total);
  if(k.wasRunning&&!c.running){
   if(k.mode==='sleep')wake();
   if(c.failed){face('wow',1400);say(`这次有 ${c.failed} 条 NG，去日志里看看？`,4200,3,{st:1,bad:1});}
   else{const n=k.runTotal;clap();later(()=>{face('happy',1600);kick(-1.6);say(n>1?`Cut！${n} 个库的封面全部一条过。`:'Cut！封面一条过。',null,3,{st:1});},320);}
  }
  if(first&&!c.running){
   if(c.noServer)later(()=>say('先在设置里选个媒体服务器，我才能开拍。',4200,3),2600);
   else if(!c.enabled)later(()=>say('插件还没启用，打开开关我就开工。',3800,3),2600);
  }
  k.wasRunning=c.running;if(k.menu)drawMenu();
 }
 function retire(){say('那我先下班啦，想我了就在设置里叫我。',3000,3);closeMenu();later(()=>k.destroy(),2600);}
 function sync(){
  if(!k.alive)return;
  const f=findFrame(),t=now();
  if(f){k.pageNoFrame=0;apply(read(f),true);}
  else if(!demo&&doc.querySelector('.mcg')){
   // 插件页开着却没有宠物的 iframe：设置里把宠物关了
   k.pageNoFrame||=t;if(t-k.pageNoFrame>2500){retire();k.pageNoFrame=1e15;}
  }else k.pageNoFrame=0;
  // 离开插件页以后在主界面里闲逛，换页面时说一句
  const route=location.pathname+location.hash;
  if(route!==k.route){const firstRoute=!k.route;k.route=route;if(!firstRoute&&!doc.querySelector('.mcg')){const hit=ROUTES.find(([re])=>re.test(route));if(hit)later(()=>sayOnce('route'+hit[1],60000,hit[1],2800,1),600);}}
  if(k.away&&t>k.awayUntil&&f)comeBack();
  if(ticks++%5===0)surroundings();
  later(sync,400);
 }
 // 离开插件页以后自己去问进度：生成中 2.5 秒一次，平时半分钟一次，标签页在后台时不问
 function poll(){
  if(!k.alive)return;
  const again=ms=>{host.clearTimeout(pollTimer);pollTimer=host.setTimeout(poll,ms);};
  if(!pollUrl||doc.hidden||!host.fetch){again(3000);return;}
  host.fetch(pollUrl,{credentials:'omit',cache:'no-store'}).then(r=>{
   if(r.status===410){pollUrl='';pollDead=true;retire();return null;}
   if(!r.ok)throw new Error(String(r.status));return r.json();
  }).then(s=>{if(!k.alive||pollDead)return;pollFail=0;if(s)apply(s,false);again(k.state.running?2500:30000);})
  .catch(()=>{if(!k.alive)return;if(++pollFail>=4){pollUrl='';pollDead=true;}again(k.state.running?5000:30000);});
 }
 // 周围环境：页面明暗（气泡要和页面反着来才看得清）、手机底部导航栏（站到它上面）、记住站的位置
 function surroundings(){
  let light=!host.matchMedia('(prefers-color-scheme: dark)').matches;
  for(let el=doc.querySelector('.v-application')||doc.body,i=0;el&&i<4;el=el.parentElement,i++){
   const m=(host.getComputedStyle(el).backgroundColor||'').match(/^rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+))?/);
   if(m&&(m[4]===undefined||+m[4]>.5)){light=(.2126*m[1]+.7152*m[2]+.0722*m[3])/255>.55;break;}
  }
  flag('on-light',light);
  let ground=6;
  for(const nav of doc.querySelectorAll('.footer-nav-card,.v-bottom-navigation')){
   const r=nav.getBoundingClientRect();
   if(r.height>0&&r.height<140&&r.bottom>=host.innerHeight-40&&host.getComputedStyle(nav).visibility!=='hidden')ground=Math.max(ground,Math.round(host.innerHeight-r.top)+4);
  }
  if(ground!==GROUND){GROUND=ground;root.style.bottom=ground+'px';}
  if(k.mode==='idle'&&k.target===null&&!k.drag&&k.y===0&&maxX()>0){const p=+(k.x/maxX()).toFixed(3);if(Math.abs(p-prefs.pos)>.02){prefs.pos=p;savePrefs();}}
 }

 // ---- 小菜单
 function drawMenu(){
  const s=k.state,head=menuHead.lastElementChild;
  head.textContent=s.running?`正在拍 ${s.done||0}/${s.total||'?'}`+(s.library?` · ${s.library}`:''):s.noServer?'还没选媒体服务器':s.enabled===false?'插件未启用':s.failed?`上次有 ${s.failed} 条 NG`:'待命中'+(s.style?` · ${s.style}`:'');
  menuHead.classList.toggle('run',!!s.running);menuHead.classList.toggle('bad',!s.running&&!!s.failed);
  menu.querySelector('[data-act=quiet]').setAttribute('aria-checked',String(prefs.quiet));
  menu.querySelector('[data-act=stay]').setAttribute('aria-checked',String(prefs.stay));
  menu.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.size===prefs.size)));
 }
 function openMenu(){
  if(k.menu||k.away||k.mode==='leave')return;if(k.mode==='sleep')wake();
  k.menu=true;k.target=null;k.sulkUntil=0;if(k.eyes==='back')face('open');drawMenu();menu.classList.add('on');
  root.style.setProperty('--mcgk-mh',menu.offsetHeight+'px');bubble.classList.remove('on');k.talkUntil=0;touched();
 }
 function closeMenu(){if(!k.menu)return;k.menu=false;menu.classList.remove('on');k.nextAct=now()+4000;}
 function setSize(key){
  if(!SIZES[key]||key===prefs.size)return;const center=k.x+SIZE/2;prefs.size=key;SIZE=SIZES[key];root.style.setProperty('--mcgk-s',SIZE+'px');
  k.x=clamp(center-SIZE/2,0,maxX());kick(key==='s'?1.6:-1.6);face('happy',1200);
  say(key==='s'?'缩小！这样更不挡路。':key==='l'?'变大！看得更清楚了吧。':'还是这个个头顺眼。',2200,3);
 }
 function onMenu(e){
  const b=e.target.closest?.('button');if(!b)return;e.stopPropagation();touched();
  if(b.dataset.size)setSize(b.dataset.size);
  else if(b.dataset.act==='quiet'){prefs.quiet=!prefs.quiet;face(prefs.quiet?'open':'happy',1400);say(prefs.quiet?'好，我只在开拍和收工的时候出声。':'解除静音！憋坏我了。',2600,3);}
  else if(b.dataset.act==='stay'){prefs.stay=!prefs.stay;k.target=null;say(prefs.stay?'收到，我就站这儿不乱跑。':'可以到处走啦～',2400,3);if(!prefs.stay)kick(-1);}
  else if(b.dataset.act==='leave'){closeMenu();leave(k.x+SIZE/2<host.innerWidth/2?-1:1);return;}
  savePrefs();drawMenu();
 }
 function onOutside(e){if(k.menu&&!e.target?.closest?.('.mcgk'))closeMenu();}

 // ---- 指针：摸、戳、拖、扔
 function onDown(e){
  if(e.button!==0||e.target.closest?.('.mcgk-menu'))return;e.preventDefault();e.stopPropagation();wake();
  const d=k.drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:k.x,oy:k.y,moved:false,held:false,lx:e.clientX,ly:e.clientY,lt:now(),vx:0,vy:0,start:now()};
  // 按住不动：打开小菜单（触屏没有右键）
  d.press=host.setTimeout(()=>{if(k.alive&&k.drag===d&&!d.moved){d.held=true;openMenu();}},600);
  root.classList.add('drag');root.setPointerCapture?.(e.pointerId);
 }
 function onMove(e){
  const p={x:e.clientX,y:e.clientY},t=now(),prev=k.mouse;k.mouse=p;k.lastInput=t;k.cursorStill=t;
  if(k.mode==='sleep'&&Math.hypot(p.x-(k.x+SIZE/2),p.y-(host.innerHeight-GROUND-k.y-SIZE/2))<220)wake(true);
  const d=k.drag;
  if(d&&d.id===e.pointerId){
   if(d.held)return;
   const dt=Math.max(1,t-d.lt);d.vx=d.vx*.6+(p.x-d.lx)/dt*1000*.4;d.vy=d.vy*.6+(p.y-d.ly)/dt*1000*.4;d.lx=p.x;d.ly=p.y;d.lt=t;
   if(!d.moved&&Math.abs(p.x-d.sx)+Math.abs(p.y-d.sy)>6){d.moved=true;host.clearTimeout(d.press);closeMenu();k.mode='drag';k.target=null;k.sulkUntil=0;face('wow',500);say(pick(['哇——放我下来！','飞起来了！','慢点慢点！']),1600);}
   if(d.moved){k.x=clamp(d.ox+p.x-d.sx,-SIZE*.4,maxX()+SIZE*.4);k.y=clamp(d.oy-(p.y-d.sy),0,host.innerHeight-SIZE-GROUND);
    if(t-d.start>4500&&sayOnce('hold',15000,'抱够了没～放我下来嘛。',2200))face('love',1500);}
   return;
  }
  if(!prev||k.mode!=='idle'||k.menu)return;
  const cx=k.x+SIZE/2,cy=host.innerHeight-GROUND-k.y-SIZE*.45,dist=Math.hypot(p.x-cx,p.y-cy);
  // 在身上来回移动就是在擦黑板
  if(e.buttons===0&&e.target?.closest?.('.mcgk')){
   if(t-k.petAt>500)k.petDist=0;k.petDist+=Math.abs(p.x-prev.x)+Math.abs(p.y-prev.y);k.petAt=t;
   if(k.petDist>240&&(t-k.lastPet>3200||t<k.sulkUntil)){k.lastPet=t;k.petDist=0;touched();
    if(t<k.sulkUntil){k.sulkUntil=0;face('happy',1800);kick(-1);say('……好吧，原谅你了。');}
    else{face(Math.random()<.4?'love':'happy',1800);kick(-.9);say(pick(PET));}}
   return;
  }
  if(t<k.sulkUntil)return;
  // 光标从上方快速扑下来：跳起来顶它一下
  const vy=p.y-prev.y;
  if(!reduced&&vy>18&&dist<110&&p.y<cy&&t-k.lastBonk>6000){k.lastBonk=t;k.target=null;k.mode='air';k.vy=560;k.vx=prefs.stay?0:(p.x-cx)*2;face('happy',900);say(pick(['嘿！','顶！','抓不到我～']),1200);return;}
  // 贴着地面快速划过：追上去
  if(!reduced&&!prefs.stay&&Math.abs(p.x-prev.x)>35&&p.y>host.innerHeight-170&&once('chase',9000)){hopTo(p.x);say(pick(['等等我！','追～','别跑！']),1300,1);}
 }
 function onUp(e){
  const d=k.drag;if(!d||d.id!==e.pointerId)return;k.drag=null;host.clearTimeout(d.press);root.classList.remove('drag');root.releasePointerCapture?.(e.pointerId);touched();
  if(d.held)return;
  if(d.moved){
   // 拖到窗口边上松手：它就从那边走掉
   if(e.clientX<6||e.clientX>host.innerWidth-6){leave(e.clientX<6?-1:1);return;}
   k.mode='air';k.vx=clamp(d.vx,-1600,1600);k.vy=clamp(-d.vy,-1200,1600);if(now()-d.lt>90){k.vx=0;k.vy=0;}
   const t=now();k.throws=k.throws.filter(x=>t-x<20000);if(Math.hypot(k.vx,k.vy)>500)k.throws.push(t);
  }else if(k.menu)closeMenu();

 }
 function poke(){
  const t=now();k.pokes=k.pokes.filter(x=>t-x<4000);k.pokes.push(t);const n=k.pokes.length;
  if(t<k.sulkUntil){sayOnce('sulkpoke',2500,pick(['哼。','不理你。','……（背对着你）']),1500);return;}

  if(n>=3){face('angry',1300);kick(1.6);say(pick(POKE_MORE),1700);return;}

 function onDbl(e){if(!e.target?.closest?.('.mcgk')||e.target.closest('.mcgk-menu'))return;e.preventDefault();if(k.mode==='idle'&&!k.menu&&!reduced&&now()>k.sulkUntil){k.mode='spin';k.spin=0;k.vy=520;k.y=Math.max(k.y,1);face('happy',1200);touched();}}

 function wake(loud){if(k.mode==='sleep'){k.mode='idle';face('wow',700);kick(1.4);if(loud)say('唔……我没睡！在记场次呢。',2200);k.nextAct=now()+6000;}k.lastInput=now();}
 function leave(side){closeMenu();k.mode='leave';k.target=null;k.dir=side;k.x=clamp(k.x,0,maxX());face('happy',1200);say('那我先回片场了，想我就打开插件页找我。',2600,3);}

 let typing=0;

   else if(/cron|定时|周期/i.test(label))say('定时的事交给我，到点我就喊 Action。',2400,1);
   else if(/^\d+(\.\d+)?$/.test(v))say(pick([`${v}？嗯……我记下了。`,`${v}，就这个数！`]),2000,1);
   else if(v.length>30)say('打字好快！我都抄不过来。',2000,1);
  },1300);
 }
 // 你要在它站的地方打字：让到一边去，不挡输入框
 function onFocus(e){
  const el=e.target;if(!el?.getBoundingClientRect||el.closest?.('.mcgk')||k.drag||k.menu||k.away||(k.mode!=='idle'&&k.mode!=='sleep'))return;
  if(!(/TEXTAREA|SELECT/.test(el.tagName)||el.isContentEditable||(el.tagName==='INPUT'&&!/checkbox|radio|button|submit|range|file|hidden/.test(el.type))))return;
  const r=(el.closest('.v-field,.v-input')||el).getBoundingClientRect();
  if(r.bottom<host.innerHeight-GROUND-SIZE-4||r.right<k.x-8||r.left>k.x+SIZE+8)return;
  const right=r.right+16,left=r.left-SIZE-16,options=[right<=maxX()?right:null,left>=0?left:null].filter(v=>v!==null);
  if(!options.length)return;wake();go(options.sort((a,b)=>Math.abs(a-k.x)-Math.abs(b-k.x))[0]);say('我让让，不挡着你打字。',1600,1);
 }
 function onScroll(e){const t=now();if(t-k.scrollAt>1000)k.scroll=0;k.scroll+=Math.abs(e.deltaY||0);k.scrollAt=t;k.lastInput=t;
  if(k.scroll>4000&&sayOnce('scroll',20000,'慢点慢点，我要晕了～',2000,1))face('dizzy',1600);}
 function onCopy(){sayOnce('copy',30000,'抄作业被我看到了～',2000,1);}
 let hiddenAt=0;
 function onVisible(){
  if(doc.hidden){hiddenAt=now();return;}
  poll();
  if(hiddenAt&&now()-hiddenAt>30000&&!k.away){wake();face('love',2000);kick(-1.2);if(k.mouse)hopTo(k.mouse.x);say(pick(['你终于回来啦！我等了好久。','去哪儿了？我一个人记了好多场次。']),2800,2);}hiddenAt=0;
 }
 function onKey(e){
  if(e.key==='Escape'&&k.menu){closeMenu();return;}
  const el=e.target;if(/INPUT|TEXTAREA|SELECT/.test(el?.tagName||'')||el?.isContentEditable)return;k.lastInput=now();
  k.keys=(k.keys+(e.key||'').toLowerCase()).slice(-4);if(k.keys==='kada'){k.keys='';wake();clap();face('happy',1200);k.mode='air';k.vy=520;say('叫我？我在这儿！',2000,2);}}
 function onOver(e){
  const card=e.target?.closest?.('.mcg-style');
  if(card&&k.mode!=='sleep'&&now()-(k.seen.hover??-1e9)>7000){
   const name=text(card.querySelector('.mcg-style-name'))||text(card),hit=Object.keys(STYLE_LINES).find(n=>name.includes(n));
   if(hit&&say(STYLE_LINES[hit],3000,1)){k.seen.hover=now();k.lookAt=card;later(()=>{if(k.lookAt===card)k.lookAt=null;},3000);}
  }
 }
 function onResize(){k.x=clamp(k.x,0,maxX());closeMenu();}

 // ---- 每帧
 let last=now();
 function tick(t){
  if(!k.alive)return;
  const dt=Math.min(.04,(t-last)/1000||.016);last=t;
  // 自主行为
  if(k.mode==='idle'&&!k.drag&&!k.menu&&t>k.nextAct&&t>k.talkUntil&&t>k.sulkUntil){
   k.nextAct=t+rand(5500,11000);
   if(!k.state.running&&t-k.lastInput>60000){k.mode='sleep';face('sleep');}
   else if(!reduced&&!prefs.quiet&&!prefs.stay&&t-k.lastBeg>240000&&t-k.lastInput<10000&&k.mouse){
    // 你一直在忙，四分钟没理它：撒娇
    k.lastBeg=t;hopTo(k.mouse.x);face('love',2400);say(pick(['理理我嘛～','我也想帮忙！','看看我，看看我～']),2600,1);later(()=>{if(k.mode==='idle'){k.mode='air';k.vy=420;}},1200);
   }
   else if(!reduced){
    const r=Math.random();
    if(r<.5&&!prefs.stay){const span=Math.min(320,host.innerWidth*.3);k.target=clamp(k.x+rand(-span,span),8,maxX()-8);}
    else if(r<.75){k.lookAt={x:k.x+SIZE/2+(Math.random()<.5?-1:1)*300,y:host.innerHeight-200,until:t+1500};}
    else if(r<.87){clap();}
    else say(pick(IDLE),2800,0);
   }
  }
  // 光标停在它旁边不动：蹭过去
  if(k.mode==='idle'&&k.mouse&&!k.drag&&!k.menu&&t>k.sulkUntil&&t-k.cursorStill>2200&&t-k.lastNuzzle>20000){
   const cx=k.x+SIZE/2,cy=host.innerHeight-GROUND-SIZE*.45;
   if(Math.hypot(k.mouse.x-cx,k.mouse.y-cy)<130){k.lastNuzzle=t;touched();face('love',2200);k.sway=t;say(pick(['蹭蹭～','（贴着你的光标不走了）','暖暖的。']),2000,1);}
  }
  // 运动
  let legL=0,legR=0,arms=0,bob=0;
  if(k.mode==='air'||k.mode==='spin'){
   k.vy-=1900*dt;k.x+=k.vx*dt;k.y+=k.vy*dt;
   if(k.x<=0||k.x>=maxX()){k.x=clamp(k.x,0,maxX());k.vx*=-.5;}
   if(k.mode==='spin')k.spin=Math.min(360,k.spin+dt*760);
   if(k.y<=0){
    k.y=0;
    if(k.vy<-420&&k.mode==='air'){k.vy=-k.vy*.3;k.vx*=.55;kick(Math.min(3,-k.vy/260));}
    else{kick(k.mode==='spin'?1.2:Math.min(2.2,Math.abs(k.vy)/300));
     const wasAir=k.mode==='air'&&Math.abs(k.vy)>200;
     k.mode='idle';k.vx=0;k.vy=0;k.spin=0;k.target=null;k.nextAct=t+5000;
     if(wasAir){if(k.throws.length>=3){k.throws=[];face('dizzy',2600);say('世界在转……你是不是故意的！',2600);}else say(pick(['安全着陆。','咔——好险。','拍板没摔坏吧……']),1700);}
    }
   }
   legL=legR=2;arms=k.mode==='spin'?30:18;
  }else if(k.mode==='drag'){legL=2.5+Math.sin(t/110)*1.5;legR=2.5-Math.sin(t/110)*1.5;arms=22+Math.sin(t/90)*10;}
  else if(k.mode==='leave'||k.mode==='enter'||(k.mode==='idle'&&k.target!==null)){
   const goal=k.mode==='leave'?(k.dir<0?-SIZE*1.5:host.innerWidth+SIZE*.5):k.target,diff=goal-k.x;
   if(Math.abs(diff)<3||(reduced&&k.mode==='idle')){
    if(k.mode==='leave'){k.away=true;k.awayUntil=now()+600000;root.style.display='none';bubble.classList.remove('on');k.mode='idle';}
    else{k.mode='idle';k.target=null;kick(.6);}
   }else{
    k.dir=Math.sign(diff);k.x+=k.dir*Math.min(Math.abs(diff),dt*(k.mode==='idle'?90:150));
    const before=k.hop;k.hop=(k.hop+dt/.36)%1;if(k.hop<before)kick(.55);
    k.y=Math.sin(Math.PI*k.hop)*8;legL=-Math.sin(k.hop*Math.PI*2)*2.2;legR=-legL;arms=Math.sin(k.hop*Math.PI*2)*14;
   }
  }else if(k.mode==='idle'){k.y=0;bob=Math.sin(t/650)*.012;}
  if(k.mode==='sleep')bob=Math.sin(t/1100)*.025;
  // 倾斜：跟着拖动速度；蹭光标时左右摇
  let tiltGoal=k.mode==='drag'&&k.drag?clamp(k.drag.vx*.025,-28,28):k.mode==='air'?clamp(k.vx*.02,-20,20):0;
  if(t-k.sway<1600)tiltGoal+=Math.sin((t-k.sway)/130)*9;
  if(k.eyes==='dizzy')tiltGoal+=Math.sin(t/160)*7;
  k.tilt+=(tiltGoal-k.tilt)*Math.min(1,dt*10);
  // 落地压扁的弹簧
  k.squashV+=(-k.squash*260-k.squashV*14)*dt;k.squash+=k.squashV*dt*.06;k.squash=clamp(k.squash,-.18,.22);
  // 拍板：开工收工的大拍，说话时小幅开合，睡觉时半张，生气时紧闭
  const c=t-k.clapAt;let stick=0,spark=false;
  if(c<130)stick=-34*Math.sin(c/130*Math.PI/2);
  else if(c<240)stick=-34;
  else if(c<300){stick=-34*(1-(c-240)/60);}
  else if(c<480){spark=true;if(!k.clapSpark){k.clapSpark=true;kick(1.3);}}
  if(c>=480)k.clapSpark=false;
  const talking=t<k.talkUntil;
  if(c>=300&&talking&&!reduced&&k.eyes!=='back')stick=-3-7*Math.abs(Math.sin(t*.0165));
  if(c>=300&&k.mode==='sleep')stick=-9;
  if(!talking&&bubble.classList.contains('on'))bubble.classList.remove('on');
  // 眼睛：眨眼、看光标或看你正在操作的东西
  if(k.eyesUntil&&t>k.eyesUntil){k.eyesUntil=0;k.eyes=k.mode==='sleep'?'sleep':'open';}
  let blink=1;if(k.eyes==='open'){if(t>k.blinkAt+150)k.blinkAt=t+rand(2200,5600);if(t>k.blinkAt)blink=1-Math.sin((t-k.blinkAt)/150*Math.PI)*.9;}
  let gx=0,gy=0,target=null;
  if(k.lookAt){if(k.lookAt.until&&t>k.lookAt.until)k.lookAt=null;else if(k.lookAt.getBoundingClientRect){if(!k.lookAt.isConnected)k.lookAt=null;else{const r=k.lookAt.getBoundingClientRect();target={x:r.left+r.width/2,y:r.top+r.height/2};}}else target=k.lookAt;}
  if(!target&&k.mouse&&t-k.lastInput<8000)target=k.mouse;
  if(target&&k.mode!=='sleep'){const cx=k.x+SIZE/2,cy=host.innerHeight-GROUND-k.y-SIZE*.42;gx=clamp((target.x-cx)/140,-1,1)*2.8;gy=clamp((target.y-cy)/140,-1,1)*2;}
  k.lookX+=(gx-k.lookX)*Math.min(1,dt*9);k.lookY+=(gy-k.lookY)*Math.min(1,dt*9);
  // 身上的进度条：生成时底下两道粉笔线连成一条，按进度填上薄荷色；总数还没出来时来回扫
  const busy=!!k.state.running;
  if(busy){
   const total=k.state.total,from=k.dir>0?27:73;
   if(total)put(P.bar,'d',`M${from} 81.5h${(k.dir*46*clamp(k.state.done/total,.03,1)).toFixed(1)}`);
   else put(P.bar,'d',`M${(27+(Math.sin(t/420)+1)*16).toFixed(1)} 81.5h14`);
   if(talking&&bubble.classList.contains('prog')){const w=(total?clamp(k.state.done/total,0,1)*100:0).toFixed(0)+'%';if(bubbleBar.__w!==w){bubbleBar.__w=w;bubbleBar.style.width=w;}}
  }
  // 写回 DOM
  const sy=1-k.squash+bob,sx=1+k.squash*.55-bob*.5;
  const place=`translate(${k.x.toFixed(1)}px,${(-k.y).toFixed(1)}px)`;if(root.__place!==place){root.__place=place;root.style.transform=place;}
  // 空翻绕身体中心转，倾斜绕脚底转
  put(P.sprite,'transform',`rotate(${k.spin.toFixed(1)} 50 60) translate(50 96) rotate(${k.tilt.toFixed(1)}) scale(${(sx*k.dir).toFixed(3)} ${sy.toFixed(3)}) translate(-50 -96)`);
  put(P.stick,'transform',`rotate(${stick.toFixed(1)} 19.5 29)`);
  put(P.face,'transform',`translate(${(k.lookX*k.dir).toFixed(2)} ${k.lookY.toFixed(2)})`);
  put(P.eyes,'transform',`translate(0 58.5) scale(1 ${blink.toFixed(3)}) translate(0 -58.5)`);
  put(P.legL,'transform',`translate(0 ${legL.toFixed(2)})`);put(P.legR,'transform',`translate(0 ${legR.toFixed(2)})`);
  put(P.armL,'transform',`rotate(${(-arms).toFixed(1)} 19 60)`);put(P.armR,'transform',`rotate(${arms.toFixed(1)} 81 60)`);
  const lift=clamp(1-k.y/220,.35,1);put(P.shadow,'transform',`translate(50 96.5) scale(${lift.toFixed(3)} 1) translate(-50 -96.5)`);put(P.shadow,'opacity',(.2*lift).toFixed(3));
  if(k.eyes==='sleep')put(P.z,'transform',`translate(${(Math.sin(t/700)*2).toFixed(1)} ${(-((t/60)%14)).toFixed(1)})`);
  put(root,'data-eyes',k.eyes);flag('talk',talking&&k.eyes!=='back'&&Math.sin(t*.0165)>0);flag('spark',spark);flag('busy',busy);
  if(talking||k.menu){
   const center=k.x+SIZE/2,fit=w=>clamp(center-w/2,8,Math.max(8,host.innerWidth-w-8));
   if(talking){const left=fit(k.bubbleW),below=!k.menu&&host.innerHeight-GROUND-k.y-SIZE<k.bubbleH+14;
    bubble.style.left=(left-k.x).toFixed(1)+'px';bubble.style.setProperty('--tail',clamp(center-left,14,k.bubbleW-14).toFixed(1)+'px');
    bubble.classList.toggle('below',below);bubble.classList.toggle('lift',k.menu);}
   if(k.menu)menu.style.left=(fit(200)-k.x).toFixed(1)+'px';
  }
  // 睡着了、下班了就不用每一帧都算
  if(k.away)k.slow=host.setTimeout(()=>{k.raf=host.requestAnimationFrame(tick);},800);
  else if(k.mode==='sleep'&&!k.drag)k.slow=host.setTimeout(()=>{k.raf=host.requestAnimationFrame(tick);},48);
  else k.raf=host.requestAnimationFrame(tick);
 }

 const listeners=[[doc,'pointermove',onMove,{passive:true}],[doc,'pointerup',onUp,true],[doc,'pointercancel',onUp,true],[doc,'pointerdown',onOutside,true],[doc,'dblclick',onDbl,false],
  [doc,'contextmenu',onContext,false],[doc,'mouseover',onOver,{passive:true}],[doc,'click',onClick,{capture:true,passive:true}],[doc,'change',onChange,{capture:true,passive:true}],
  [doc,'input',onInput,{capture:true,passive:true}],[doc,'focusin',onFocus,{passive:true}],[doc,'wheel',onScroll,{capture:true,passive:true}],[doc,'copy',onCopy,{passive:true}],[doc,'visibilitychange',onVisible,false],
  [doc,'keydown',onKey,{passive:true}],[host,'resize',onResize,{passive:true}]];
 k.attach=f=>{if(f)k.frame=f;k.pageNoFrame=0;pollDead=false;pollFail=0;apply(read(k.frame),true);if(k.away&&f?.closest?.('.mcg'))comeBack();};
 k.destroy=()=>{if(!k.alive)return;k.alive=false;host.cancelAnimationFrame(k.raf);host.clearTimeout(k.slow);host.clearTimeout(pollTimer);for(const id of timers)host.clearTimeout(id);timers.clear();host.clearTimeout(typing);host.clearTimeout(k.drag?.press);root.remove();style.remove();
  root.removeEventListener('pointerdown',onDown);for(const [target,type,fn,opt] of listeners)target.removeEventListener(type,fn,opt);};
 k.dev={say,clap,face,poke,leave,comeBack,apply,openMenu,closeMenu,setSize,prefs,sleep(){k.mode='sleep';face('sleep');},hold(){k.nextAct=now()+6e8;k.target=null;if(k.mode==='enter')k.mode='idle';k.lastInput=now()+6e8;k.lastNuzzle=now()+6e8;k.lastBeg=now()+6e8;}};

 root.addEventListener('pointerdown',onDown);menu.addEventListener('click',onMenu);
 for(const [target,type,fn,opt] of listeners)target.addEventListener(type,fn,opt);
 let seen=false;try{seen=host.sessionStorage.getItem('mcgk-hi')==='1';host.sessionStorage.setItem('mcgk-hi','1');}catch{}
 if(!seen){
  // 第一次见面：从左边走进来，拍一下板，打招呼
  if(!reduced){k.target=k.x;k.x=-SIZE;k.mode='enter';}
  later(()=>{clap();later(()=>say(GREET,3200,3),330);},700);
 }
 if(!prefs.hinted)later(()=>{if(say('右键点我有个小菜单：可以让我安静点，或者站着别动。',4600,3)){prefs.hinted=1;savePrefs();}},seen?5000:9000);
 surroundings();k.raf=host.requestAnimationFrame(tick);sync();later(poll,1500);
}
